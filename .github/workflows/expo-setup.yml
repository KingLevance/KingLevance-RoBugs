# One-time setup for over-the-air updates: links this repo to an EAS project
# (owner from app.json) and writes the update URL into app.json.
# Needs the repository secret EXPO_TOKEN (expo.dev → Access tokens).
name: Expo setup (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set. Add it under Settings → Secrets and variables → Actions (create the token at expo.dev → Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install node modules
        run: npm ci
      - name: Create / link the EAS project
        run: npx eas-cli@latest init --non-interactive --force
      - name: Write the update URL into app.json
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const id = app.expo?.extra?.eas?.projectId;
            if (!id) { console.error("::error::No expo.extra.eas.projectId after eas init"); process.exit(1); }
            app.expo.updates = { ...(app.expo.updates ?? {}), url: "https://u.expo.dev/" + id };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("projectId", id, "→", app.expo.updates.url);
          '
      - name: Commit app.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then echo "app.json already up to date"; exit 0; fi
          git commit -m "Configure EAS project and update URL"
          git push
