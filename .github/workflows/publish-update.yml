# Publishes the current JS/assets as an over-the-air update to installed builds.
#
# IMPORTANT: only builds with the same app.json "version" (the runtime version)
# receive an update. After native changes (a new native library, config
# plugins, the icon/splash, app.json native settings) bump "version" and build
# a new .ipa with ios-sideload.yml.
name: Publish OTA update
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the EAS dashboard)
        required: true
        default: Game update
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install node modules
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Tests (balance + determinism)
        run: npm test
      - name: Publish the update
        env:
          MESSAGE: ${{ inputs.message }}
        run: npx eas-cli@latest update --channel production --environment production --message "$MESSAGE" --non-interactive
